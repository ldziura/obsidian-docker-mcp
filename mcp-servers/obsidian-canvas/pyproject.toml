[project]
name = "obsidian-canvas-mcp"
version = "0.1.0"
description = "MCP server for Obsidian Canvas operations via the Local REST API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_canvas"]

[project.scripts]
obsidian-canvas-mcp = "obsidian_canvas:main"
