services:
  # Job scheduler for automated backups and maintenance
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: obsidian-ofelia
    restart: unless-stopped
    # Scoped to this project only (2026-08-04) — an unfiltered `daemon --docker`
    # adopts ofelia.* labels from EVERY container on the box (the cross-daemon
    # adoption bug fixed on anki/paperless 2026-08-02).
    command: daemon --docker --docker-filter label=com.docker.compose.project=obsidian-docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # NOTE: this ofelia parses SIX-field cron (seconds first). The old 5-field
      # "0 3 * * *" was read as sec=0 min=3 every hour -> the "daily" backup ran
      # hourly at :03 for months (fixed 2026-08-04, same class as anki/paperless).

      # Daily vault backup at 03:00
      ofelia.job-exec.backup.schedule: "0 0 3 * * *"
      ofelia.job-exec.backup.container: "obsidian"
      ofelia.job-exec.backup.command: "sh -c 'tar -czf /config/backups/vault-$(date +%Y%m%d-%H%M%S).tar.gz -C /vault .'"

      # Cleanup old backups (keep last 7 days) at 04:00
      ofelia.job-exec.cleanup.schedule: "0 0 4 * * *"
      ofelia.job-exec.cleanup.container: "obsidian"
      ofelia.job-exec.cleanup.command: "sh -c 'find /config/backups -name \"vault-*.tar.gz\" -mtime +7 -delete'"

      # Weekly-restart job REMOVED 2026-08-04: it had been a no-op stub since
      # creation (command was `echo Restart triggered` — job-exec cannot restart
      # its own target container). If a real weekly Electron-memory restart is
      # ever wanted, implement as a job-run with a docker-cli image + socket.

  # Tailscale for secure network access
  tailscale:
    image: tailscale/tailscale:latest
    container_name: obsidian-tailscale
    hostname: obsidian-docker
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--reset
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: slothcroissant/caddy-cloudflaredns:latest
    container_name: obsidian-caddy
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}

  # Main Obsidian application
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Chicago
      - CUSTOM_USER=lucas
      - PASSWORD=${OBSIDIAN_PASSWORD}
      - SUBFOLDER=/
      - TITLE=Obsidian
    volumes:
      - ./obsidian-config:/config
      - ./vault:/vault
    ports:
      # Local access (HTTPS)
      - "13443:3000"
      # Local REST API access
      - "27124:27124"
    shm_size: "1gb"
    depends_on:
      - tailscale
